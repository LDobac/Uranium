[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "uranium"
version = "0.1.0"
description = "Uranium: StarCraft Brood War Terran bot - training and inference"
requires-python = ">=3.14"
dependencies = ["numpy>=2", "safetensors>=0.6"]

[project.optional-dependencies]
test = ["pytest>=8"]
compile = ["triton-windows>=3.8; sys_platform == 'win32'"]

[tool.maturin]
python-source = "python"
module-name = "uranium._core"
manifest-path = "crates/uranium-py/Cargo.toml"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "gpu: needs a CUDA or ROCm device (032-AC1, AC8)",
    "data: needs the real BC shards (URANIUM_TEST_SHARDS) and map precomputes",
    "host_env: reads the host .env on purpose (every other test runs without it)",
]
