[package]
name = "bench"
description = "M1(a) Burn/Vulkan micro-benchmarks for the training hosts (spec 060-R2)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enable only on a CUDA host (needs the CUDA toolkit): cargo run -p bench --release --features cuda -- --backend cuda
cuda = ["burn/cuda", "uranium-model/cuda"]

[dependencies]
burn = { workspace = true, features = ["std", "autodiff", "vulkan", "flex"] }
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
uranium-model = { path = "../../crates/uranium-model" }
