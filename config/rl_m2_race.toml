weight = 0.1
vs_model = 0.0
from_s = 180.0
until_s = 480.0
scv_target = 20

[concede]
# 042-R14 collapse concede of RL training games (AMB-042-15): a model session (learning agent or
# model opponent) whose own supply is at most max_supply on the game screen (supply_used <=
# 2 x max_supply, units in production included) at every decision for hold_s seconds, counted
# from after_s, leaves with "gg"; the game is a normal loss of that side (020-R18, 033). Plan /
# evaluation games never concede. false = the earlier behaviour.
