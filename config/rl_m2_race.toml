# Raw values: enemy main, each enemy building type, a second enemy resource depot, workers, army.
main = 0.3
building_type = 0.1
expansion = 0.1
workers = 0.1
army = 0.1

[reward.survive]
# 033-R10 r_survive: game seconds in [from_s, until_s] x min(own SCVs / scv_target, 1) /
