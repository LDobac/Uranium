# 051-R11 B1 branch games (rush response), AMB-051-1..3 default adopted (user confirmation 2026-11-12).
# Read by tools/eval/branch_plan.py: `trunk` writes the trunk plan, `branches` the points, the branch
# list and the branch plan from the trunk job's results.
name = "branch-b1"
# 051-R1 ②: the S0 checkpoint, stochastic sampling.
checkpoint = "checkpoints/m2-s1/ckpt-39096"
# H = 8:00 (051 terms); trunk and branch plans use max_frames = H + 48 (051-R1).
horizon = 11520
wall_timeout_s = 7200
# 051-R11 ③ (AMB-051-2): repeats per (point, alternative), outermost in the branch plan (051-R10).
repeats = 4

# 051-R11 ① (AMB-051-1) / 051-R15: per map 10 first-target-hit and 10 miss trunks (020-R21), the
# seeds of the rush check plan's T0 zerg_rush block of that map in list order; a trunk with fewer
# than 2 decision points is replaced by the next seed of the same map and condition.
[trunks]
rush_plan = "config/plans/rush5_check.toml"
opponent = { kind = "t0", race = "zerg", build = "zerg_rush" }
maps = ["fighting_spirit", "circuit_breaker"]
hit = 10
miss = 10

# Decision points (051-R3 rules, 051-R11 ①): the first decision from 2:15 / 2:45 on where
# Build_Bunker is open, windows end at 4:00. Two points on one decision count once.
[[snapshots]]
name = "b1-p1"
from_frame = 3240
to_frame = 5760
any_open = ["Build_Bunker"]

[[snapshots]]
name = "b1-p2"
from_frame = 3960
to_frame = 5760
any_open = ["Build_Bunker"]

# 051-R11 ② (AMB-051-3): the alternatives (051-R7 rules). A t-only force whose action is closed at
# t drops that alternative at that point (051-R10).
[[alternative]]
name = "none"

[[alternative]]
name = "force_bunker"
rules = [{ op = "force", action = "Build_Bunker", from_s = 0, to_s = 0 }]

[[alternative]]
name = "ban_bunker_90s"
rules = [{ op = "ban", action = "Build_Bunker", from_s = 0, to_s = 90 }]

[[alternative]]
name = "force_marine"
rules = [{ op = "force", action = "Train_Marine", from_s = 0, to_s = 0 }]
