# 050-R9 / 050-AC5 measurement protocol of the Checkpoint 1 lineage (plan "측정 프로토콜", docs/measurement_protocol.md).
# Every lineage point with its metric menu and the conditions pinned to what Checkpoint 1 was measured with
# (reports/checkpoint1.md 7, checkpoint1_rl.md). tools/eval/protocol.py generates eval jobs from this file and
# refuses a request that differs: another plan, seed list, sampling mode, zero_last_failed or max_frames, a
# metric outside the point's menu, a plan of the other family, a run without the lineage prefix, T1 / OSS bots
# that are not the recorded NDEBUG builds (config/protocol/t1_bots.toml), T1 hosts of another platform than the
# point's Checkpoint 1 counterpart; and the diagnostics (cue_diag, dead_channels) on another hold-out or with
# other settings (`protocol.py diag` / `check-diag`). Paths are relative to the repository (templates) or to
# URANIUM_SHARED_DIR (checkpoints, ck1_outputs, outputs).
schema = 1

[lineage.ck1]
description = "Checkpoint 1 lineage: BC S1 / S2, teacher mix e1..e10, DAgger r1 / r2, AC1 V-trace RL"
run_prefix = ""
# Measured already (050-R9): cells it has are not measured again; its existing eval jobs are re-tabulated with
# both held / bunker definitions (`protocol.py tables`). New for it: the cue diagnostics at every point, and
# per point the cells of the 050-R9 point table it never measured (`ck1_supplement`, measured with the same plan
# when a comparison needs them: "비교가 필요하면 Checkpoint 1 쪽을 같은 plan으로 보충 측정한다"). Its
# dead_channels cell is "not measured (no training-log statistics)" (user decision 2026-11-10, AMB-050-5).
new_metrics = ["cue_diag"]

[lineage.m2]
description = "model 2 lineage (BC retrained with the fixes, the same points and metrics)"
run_prefix = "m2-"

# ------------------------------------------------------------------ teacher-forced metrics

[metric.val500]
kind = "bc_eval"
description = "action top-1 etc. on 500 target-map val games (032-R17 2, record only from the teacher path on)"
datasets = ["replays/shards/stardata", "replays/shards/community", "replays/shards/scr_ladder", "replays/shards/personal"]
split = "val"
games = 500
seed = 1
backend = "rocm"
config = "config/bc.toml"
output = "artifacts/bc_e2_val/val500/<run>__<ckpt>.json"
# 050-R10 3: the same output file as val500_race, so the same additive option (bunker_before field).
extra_args = ["--bunker-before", "5760"]

[metric.val500_race]
kind = "bc_eval"
description = "val500 split by opponent race (050-R9 point table, 050-R10 regression gate 2: per-race top-1 / NLL)"
datasets = ["replays/shards/stardata", "replays/shards/community", "replays/shards/scr_ladder", "replays/shards/personal"]
split = "val"
games = 500
seed = 1
backend = "rocm"
config = "config/bc.toml"
# The same run as val500; the per-race numbers are in its output (python/uranium/bc/eval.py writes
# `by_enemy_race = {terran|protoss|zerg: {steps, action_top1, nll}}` keyed by the view's enemy race
# (GameInfo)), and check-bc-eval refuses an output without it or with a race that has no scored step.
requires_field = "by_enemy_race"
races = ["terran", "protoss", "zerg"]
note = "bc-eval writes by_enemy_race (per enemy race steps / action_top1 / nll) in its JSON; an older output lacks it"
# 050-R10 3 (human TvT / TvP part): the mean p(Build_Bunker) before 4:00 per enemy race (`bunker_before`),
# input of tools/eval/regression_gate.py. The option only adds that field.
extra_args = ["--bunker-before", "5760"]
output = "artifacts/bc_e2_val/val500/<run>__<ckpt>.json"

[metric.test]
kind = "bc_eval"
description = "action top-1 etc. on every target-map test game (041-AC1, the BC baseline)"
datasets = ["replays/shards/stardata", "replays/shards/community", "replays/shards/scr_ladder", "replays/shards/personal"]
split = "test"
# No --games / --seed: every test game (1,199 when Checkpoint 1 was measured).
expect_games = 1199
# bc-s2e2-pt was scored on the CUDA host (artifacts/bc_main_eval/test_cuda/); CUDA vs ROCm differed by 0.13 %p.
backend = "cuda"
config = "config/bc.toml"
output = "artifacts/bc_main_eval/test_cuda/<run>.json"

[metric.per_action]
kind = "per_action"
description = "per-action teacher-forced top-1 / tile accuracy on the teacher hold-out (val split of the botgen teacher games)"
# orig = the 2026-11-06 teacher shards only (165 val games, 94,433 steps): the hold-out of the BC / FT / clone /
# bc-mix columns (runs/mix/per_action_eN.json). `full` adds teacher-20261107-macro2 and teacher-20261109-macro3 (reported apart).
holdout = "orig"
split = "val"
seed = 1
backend = "cuda"
config = "config/bc.toml"

# ------------------------------------------------------------------ game metrics (eval jobs, 020-R15)
# `plans` per family: bc = BC-family checkpoints (BC, mix, DAgger; zero_last_failed true where Checkpoint 1
# used it), rl = RL checkpoints (real last_failed).

[metric.rush]
kind = "games"
description = "050-R6 128-game rush check: held_8m / held_s, scout, bunker_order / bunker_unit, scv_4m by start condition"
plans = ["rush_check"]

[metric.macro]
kind = "games"
description = "050-R8 macro 40: bunker_order / bunker_unit before 4:00, CC order by 5:00, scv_8m >= 16, results"
plans = ["macro"]

[metric.tvz]
kind = "games"
description = "TvZ 32 (T0 zerg, seeds 42069..42100)"
plans = { bc = ["tvz_bc"], rl = ["tvz_rl"] }

[metric.t0_100]
kind = "games"
description = "T0 100 (3 races x 2 maps, seed_base 42000); its games 69..100 are the TvZ 32 seeds"
plans = { bc = ["t0_100"] }

[metric.t0_300]
kind = "games"
description = "T0 300 (3 races x 2 maps x 50, seed_base 41300)"
plans = { bc = ["t0_300"] }

[metric.t0_600]
kind = "games"
description = "T0 600 (041-AC2: argmax + stochastic, seed_base 41000)"
plans = { bc = ["t0_600"] }

[metric.t0_tp]
kind = "games"
description = "050-R10 T0 standard Terran and Protoss, 32 each (the first 16 seeds per map of the T0 300 blocks)"
plans = { bc = ["t0_tp"] }

[metric.t1]
kind = "games"
description = "T1 300 (6 T1 bots x 50, NDEBUG builds, opponent-crash games invalid)"
plans = { bc = ["t1_bc"], rl = ["t1_rl"] }

[metric.ac1]
kind = "games"
description = "042-AC1 200 (Fighting Spirit vs T0 zerg; BC baseline a / b / c, RL stochastic + argmax with real last_failed)"
plans = { bc = ["ac1_stoch_lf0", "ac1_stoch_real", "ac1_argmax_real"], rl = ["ac1_stoch_real", "ac1_argmax_real"] }

# ------------------------------------------------------------------ diagnostics of every point (050-R9 "추가 지표")
# Decided by the user 2026-11-10 (AMB-050-4, -5, -6 Resolved; spec/050-evaluation.md 050-R9):
# - cue_diag: `python -m uranium diag` (python/uranium/diag) on two hold-outs, generated and checked by
#   `protocol.py diag` / `check-diag` (docs/measurement_protocol.md 4):
#   `teacher` = the Zerg teacher hold-out (HP / start cues, counterfactual intervention), as before;
#   `human` = human TvT / TvP games for the enemy max-seen production-building count (`count|focus_rows`: the
#   barracks / gateway count), which is constant 1 on the Zerg teacher rows.
# - dead_channels: the 041-R25 training-log sp_* records only (tools/eval/spatial_logs.py). The Checkpoint 1
#   runs have none: their cell is "not measured (no training-log statistics)". `diag spatial` stays an ad hoc tool.
# - s1e2: the diagnostics at the run's final checkpoint only (`diag_final_only` on the point).
# One output folder per checkpoint (`output`, under URANIUM_SHARED_DIR): <out>/<set>/ per cue hold-out,
# spatial_log.json, protocol.json.

[metric.cue_diag]
kind = "diag_cue"
description = "050-R9 cue diagnostics: ridge R2 of the enemy production building's HP / start at the model's stages up to h_t (teacher hold-out, Zerg), the enemy max-seen production-building count (human TvT / TvP), counterfactual intervention deltas (teacher hold-out)"
config = "config/bc.toml"
backend = "rocm"
output = "artifacts/diag/<run>__<ckpt>"
sets = ["teacher", "human"]

[metric.cue_diag.teacher]
# The val + test splits of the 2026-11-06 teacher games and of teacher-20261107-macro2 (433 TvZ games), the data
# of the Checkpoint 1 diagnosis (reports/jepa_survey.md 10.1), the U1 parity (2026-11-09) and the 041-R24 lambda
# runs (2026-11-10, <shared>/eval/m2-lambda-20261110). Each source is a link tree of the listed parts of
# <shared>/datasets/replays/shards/botgen under <cache>/diag_holdout/<name>/botgen (as per_action.py `orig`);
# `files_sha256` = sha256 of the sorted "<part>/<file> <bytes>" lines of its shard files (the source and the
# link tree are both checked).
splits = ["val", "test"]
holdout = [
    { name = "hold_orig", source = "datasets/replays/shards/botgen", parts = ["teacher-20261106-a", "teacher-20261106-b", "teacher-20261106-c", "teacher-20261106-d"], files = 20, files_sha256 = "48736f36a5fb464b5ab0e8537c1c7a62970aa591bad10d1fe07998bf2e5c493b" },
    { name = "hold_macro2", source = "datasets/replays/shards/botgen", parts = ["teacher-20261107-macro2"], files = 5, files_sha256 = "379d41132e47efdac27321760eda2e0f38698d91ea0608f1d3eb9e7157faf6ad" },
]

[metric.cue_diag.teacher.dump]
# The settings of the lambda runs' dumps (the diag dump defaults, lanes per group 4 for the ROCm hosts' memory)
# plus `--cf`: 050-R9 asks for the counterfactual intervention deltas, which the lambda runs did not measure.
# The counterfactual passes keep their own recurrent states; the real pass, its activations and the probes are
# the same as without --cf. Cost of the 7 passes per lane group: TBD (timed on the first run; the lambda dumps
# without --cf took about 10.5 min, the first 48 min).
lanes_per_group = 4
row_until = 8640
act_until = 5760
act_every = 1
core_points = "gate"
cf = true
# python/uranium/diag/dump.py CF_STARTS (frames: early, late start of the anchor)
cf_starts = { T = [1280, 2080], P = [1720, 3030], Z = [1800, 3240] }
# Data fingerprint (counted by the lambda runs' dumps, every model alike: the rows depend on the data only)
expect_games = 433
expect_rows = 176873
expect_act_rows = 36516

[metric.cue_diag.teacher.probes]
# U1 parity / lambda settings: --races Z --boot 500, gain resid, the other diag probes defaults (CPU)
races = ["Z"]
stages = ["token", "e_pool", "sp_pool", "c", "x_in", "L1.g1", "L1.out", "h", "hc"]
gain = "resid"
boot = 500
cap = 0
seed = 7
# rows / games of the reported tasks on this hold-out (the lambda runs' probes)
expect_tasks = { "hp|unf_token" = [17097, 154], "start|unf_token" = [17097, 154], "start|all_token_rows" = [36516, 351] }
# constant 1 on the Zerg pool rows (measured on the human hold-out instead): skipped by diag probes
expect_skipped = { "count|focus_rows" = "constant target" }

[metric.cue_diag.teacher.intervene]
# diag intervene defaults: window 1:30-4:00 (frames), game bootstrap
races = ["Z"]
window = [2160, 5760]
boot = 2000
seed = 3

[metric.cue_diag.teacher.report]
# The reported cells (tools/eval/diag_table.py): ridge R2 / gain per stage for the tasks, the h_t MLP(64)
# value, the nuisance-only ridge; intervention deltas (all classes) of the effects on the metrics.
stages = ["token", "e_pool", "x_in", "L1.out", "h"]
tasks = ["hp|unf_token", "start|unf_token", "start|all_token_rows"]
effects = ["start", "start_unf", "count_sc", "count_tok"]
effect_metrics = ["bunker_any", "marine_sum", "rax2_any", "label_p"]

[metric.cue_diag.human]
# Human TvT / TvP games (reports/jepa_survey.md 10.2.3 practice: the human shards' val + test splits, the T / P
# probes). Game count: user decision (confirmed 2026-11-10); the reason it was proposed: `diag dump` has no matchup filter, so
# the set is the fixed-seed shuffle of 032-R17 ② (`--games 500 --seed 1`, the val500 rule) per split, val + test
# = 1,000 games of every matchup: about 15% TvT and 50% TvP by the val500 race shares (T 161,586 / P 578,841 /
# Z 359,719 steps), i.e. about 150 TvT and 500 TvP views, against 497 / 1,142 in the survey's full pass
# (about 4.2 hours for two checkpoints on a Linux ROCm host), at about half its games per point. The TvZ games
# ride along (Zerg probes are not run on them). `files_sha256` = sha256 of the sorted
# "<source>/<file> <sha256> <bytes>" lines of the four datasets' manifest.json (2,069 files, frozen since 10-23).
splits = ["val", "test"]
games = 500
seed = 1
datasets = ["replays/shards/stardata", "replays/shards/community", "replays/shards/scr_ladder", "replays/shards/personal"]
files = 2069
files_sha256 = "d170f56d53279892d19615b547e3489a79f9d2f31bb75b9758d407667e4adfaa"

[metric.cue_diag.human.dump]
# ROCm f32, lanes per group 4 as the teacher hold-out; the survey's T / P settings (docs/commands.md: dump
# --act-until 8640 --act-every 4): activations to 6:00, every 4th step (the survey's setting for memory). No
# counterfactual passes (the survey ran none on human games).
lanes_per_group = 4
row_until = 8640
act_until = 8640
act_every = 4
core_points = "gate"
cf = false
# Each game read only up to 6:00 (`diag dump --read-until`): the rows and activations are the same (all before
# 8640), the steps after it are not extracted (human games run 15-20 min). Without it a 32-lane batch held whole
# human games (about 8 GB resident on the 14 GB ROCm host) and spent most of its time on steps it drops.
read_until = 8640
# Data fingerprint: the first run's values (Checkpoint 1 r1, 2026-11-11, `check-diag` NOTE); the rows depend on
# the data only (the same with and without --read-until).
expect_games = 1000
expect_rows = 763946
expect_act_rows = 85872

[metric.cue_diag.human.probes]
# The survey's T / P settings (docs/commands.md: probes --cap 60 --boot 300), gain resid
races = ["T", "P"]
stages = ["token", "e_pool", "sp_pool", "c", "x_in", "L1.g1", "L1.out", "h", "hc"]
gain = "resid"
boot = 300
cap = 60
seed = 7
expect_tasks = {}
expect_skipped = {}

[metric.cue_diag.human.report]
stages = ["token", "e_pool", "x_in", "L1.out", "h"]
# count|focus_rows = the enemy max-seen production-building count (050-R9 "적 최대 관측 수"); it must have values
tasks = ["count|focus_rows", "hp|unf_token", "start|all_token_rows", "focus2_by_300|all_token_rows"]
required = ["count|focus_rows"]

[metric.dead_channels]
kind = "diag_train_log"
description = "032-R25 / 041-R25 dead-channel statistics from the run's training-log sp_* records (tools/eval/spatial_logs.py): max dead share per ReLU output layer, max const S8 / s_pool, min positive share, alarms"
output = "artifacts/diag/<run>__<ckpt>"
# the Checkpoint 1 runs logged no sp_* records (user decision 2026-11-10, AMB-050-5)
not_measured = { ck1 = "not measured (no training-log statistics, AMB-050-5)" }
# records from this update on (the alarm's start, uranium.model.monitor ALARM_FROM), up to the checkpoint's
# update (BC: ckpt-N = update N; RL: the whole log of the agent `main`)
from_update = 600
layers = ["stem", "c0", "c1", "c2", "c3", "r0", "r1", "r2", "r3", "r4", "r5"]

