# ------------------------------------------------------------------ lineage points
# metrics  = measured on the Checkpoint 1 lineage (comparable at this point) + the diagnostics every point gets
# optional = allowed at this point, no Checkpoint 1 number (Checkpoint 1 is measured only for its ck1_supplement cells)
# ck1_outputs = where the Checkpoint 1 numbers are (eval jobs under <shared>/eval, scores under <shared>/artifacts):
#   a path, a list of paths, { job, stage } (one stage of a job) or { job, as_plan } (a protocol plan's games
#   found by seed / map / opponent inside a larger job)
# ck1_supplement = cells of the 050-R9 point table Checkpoint 1 never measured: the only game / teacher-forced
#   measurements `--lineage ck1` accepts at this point (besides the diagnostics)
# t1_platforms = platform(s) of the point's Checkpoint 1 T1 games: T1 jobs of every lineage run there only
#   (user decision 2026-11-09); a point without it takes no T1 job.

[[point]]
id = "s1e1"
family = "bc"
ck1_checkpoint = "checkpoints/bc-s1-pt/ckpt-39096"
metrics = ["val500", "t0_100", "cue_diag", "dead_channels"]
optional = ["test", "rush", "macro", "tvz", "t0_300", "per_action"]
ck1_outputs = { val500 = "artifacts/bc_e2_val/val500/bc-s1-pt__ckpt-39096.json", t0_100 = "eval/bc-e2-games/bc-s1-pt__ckpt-39096" }

[[point]]
id = "s1e2"
family = "bc"
# val500 + t0_100 at every checkpoint (tools/eval/s1e2_loop.py); the diagnostics at the run's final checkpoint
# only (user decision 2026-11-10, AMB-050-6): `protocol.py diag` refuses another checkpoint of the point.
diag_final_only = true
ck1_checkpoint = "checkpoints/bc-s1e2-pt/ckpt-39094"
metrics = ["val500", "t0_100", "cue_diag", "dead_channels"]
optional = ["test", "rush", "macro", "tvz", "t0_300", "per_action"]
ck1_outputs = { val500 = "artifacts/bc_e2_val/val500/bc-s1e2-pt__ckpt-39094.json", t0_100 = "eval/bc-e2-games/bc-s1e2-pt__ckpt-39094" }

[[point]]
id = "s2e2"
family = "bc"
note = "BC baseline (RL start point, BC column of the per-action table, T1 BC row)"
ck1_checkpoint = "checkpoints/bc-s2e2-pt/ckpt-11387"
# T1 300 of the BC baseline ran on the Linux ROCm hosts (eval/t1-bc2-20261108).
t1_platforms = ["linux"]
metrics = ["val500", "test", "per_action", "rush", "t0_300", "t0_tp", "t1", "ac1", "cue_diag", "dead_channels"]
optional = ["macro", "tvz", "t0_100", "t0_600", "val500_race"]
