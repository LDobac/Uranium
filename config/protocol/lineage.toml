# ------------------------------------------------------------------ lineage points
# metrics  = measured on the Checkpoint 1 lineage (comparable at this point) + the diagnostics every point gets
# optional = allowed at this point, no Checkpoint 1 number (reported for the new lineage only; Checkpoint 1 gets no new game jobs)
# ck1_outputs = where the Checkpoint 1 numbers are (eval jobs under <shared>/eval, scores under <shared>/artifacts)
# t1_platforms = platform(s) of the point's Checkpoint 1 T1 games: T1 jobs of every lineage run there only
#   (user decision 2026-11-09); a point without it takes no T1 job.

[[point]]
id = "s1e1"
