# 041-R31 / 044-R5 model 2 path (lineage 2) distillation round 1 (m2-distill-d1): the 041-R22 ③ one-epoch
# `--init` recipe of config/bc_m2_dagger_r2.toml (the 041-R28 memory field, the model 2 tables) with the
# self-game distillation source (044-R5 ⑥). One epoch from `--s2 --init <S>` (weights only), S = the 041-R29 ④
# selection (the Checkpoint 1 counterpart model, 044-R7; AMB-044-4), its last checkpoint: r2, chosen 2026-11-14,
# `--s2 --init <shared>/checkpoints/m2-dagger-r2/ckpt-1408` (it also plays the d1 games, 044-R1).
# Data (044-R5 ②): every teacher game (`botgen`, as config/bc_m2_dagger_r2.toml), every lineage-2 DAgger game
# so far (`dagger_m2`, GameMeta.src `dagger`), every distillation game so far (`distill_m2/d1`: S's 600 games
# of config/plans/distill_m2_d1.toml against Terran / Protoss, built as decision steps (044-R2) and labelled
# by the baseline m2-s2e2/ckpt-11387 with one sample per step (044-R3), GameMeta.src `distill`) and the four
# human sources' target-map train games (S2) kept per enemy race ([data.subsample] fraction_by_race, 041-R26:
# inside the human part TvT : TvP : TvZ is the S2 human data's within +-3%p). Shares of the update steps
# (044-R5 ③, AMB-044-5): teacher + dagger 45%, distill 20%, human 35%, each +-3%p; teacher + dagger are kept
# whole (so the epoch grows, about 1,850 updates estimated), distill is subsampled per game when it has more
# than its share ([data.subsample.fraction_by_source], same hash rule as 041-R21 ②); when it has fewer, more
# distill games of the round are played to fill it (top-up plans config/plans/distill_m2_d1_x<K>.toml, user
# decision 2026-11-14), not a smaller share or less teacher + dagger. The fractions and
# [steps] come from `uranium-train mix-fractions --share teacher=0.45,distill=0.2` for data.seed 15. Learning
# rate as bc_m2_dagger_r2.toml (044-R5 ④): 3e-4 / 3e-6 x s2_lr_scale 0.1 = 3e-5 / 3e-7, warmup 5%, cosine to
# the end of the epoch. Losses as every source (044-R5 ⑤, AMB-044-6). [aux] lambda_priv 0.2, lambda_jepa 0.1
# (AMB-041-13b), as config/bc_m2_dagger_r2.toml.
# Counted 2026-11-14 (run driver distill_d1.sh count): [data.subsample] fractions and [steps].
# 041 behaviour cloning hyper-parameters (041-R3, R10: tuning targets, recorded in checkpoints).

# Parallel games per batch (B) and truncated-BPTT length (T, 041-R2 / 032-R5).
lanes = 32
seq_len = 64
# Lanes per forward/backward pass. Group gradients are summed into one update (same result as one
# pass over all lanes), so peak GPU memory follows the group, not `lanes`. 0 = all lanes at once.
micro_lanes = 1
# Burn balanced gradient checkpointing: recompute memory-bound activations during backward.
grad_checkpointing = false
# Round the batch entity count N up to a multiple of this (masked padding, same result). Fewer
# distinct tensor shapes; ~9% faster per update on the 13-game CUDA sample (2026-10-17).
pad_entities = 64
# AdamW + linear warmup + cosine decay, gradient-norm clip 1.0 (041-R3): one global L2 norm over
# all parameter gradients after the micro-lane sum (not Burn's per-tensor clip, G-D4).
# 044-R5 ④ / 041-R22 ③: x s2_lr_scale = 3e-5 peak, 3e-7 floor.
lr = 3e-4
min_lr = 3e-6
warmup_steps = 2000
# Schedule length when no stage length applies (smoke runs). `bc` uses [steps] below.
total_steps = 500000
weight_decay = 1e-4
grad_clip = 1.0
# S2 fine-tuning uses 1/10 of the learning rate (041-R4).
s2_lr_scale = 0.1
# 061-R6 (G-D6): checkpoints kept per run on the shared drive. Absent = 5; 0 = keep all.
# 041-R29 ⑨: every checkpoint of the lineage is kept (execution only, not in the fingerprint).
keep_checkpoints = 0
# Head loss weights (041-R1).
[heads]
action = 1.0
delay = 0.5
queued = 0.2
selected = 1.0
target_unit = 1.0
target_loc = 1.0

[steps]
# Only the S2 stage runs with this file. One epoch, counted by `uranium-train mix-fractions --config
# config/bc_m2_distill_d1.toml --share teacher=0.45,distill=0.2 --dataset-group replays/shards/stardata,replays/shards/community,replays/shards/scr_ladder,replays/shards/personal
# --dataset-group replays/shards/botgen,replays/shards/dagger_m2,replays/shards/distill_m2` (the datasets through
# their manifests, as the trainer's --dataset reads them; lanes 32, seq_len 64, data.seed 15).
# Counted 2026-11-14 (human 4 sources read in place, --group; botgen (its manifest: the six 021-R8 teacher folders,
# not teacher-tp-*), dagger_m2, distill_m2 through their manifests, --dataset-group): 4,443 games,
# 3,971,735 steps, of which the
# teacher botgen 2,057 games, 1,207,759 steps + dagger_m2 945 games, 599,844 steps
# = 45.5% (target 45%), distill 872 games, 761,273 steps = 19.2% (target 20%),
# human 35.3% (target 35%); human TvT : TvP : TvZ steps 14.8 : 49.4 : 35.8% against the
# S2 human data's 14.9 : 49.2 : 35.9%.
# s1 / ablation_a are unused (0 = total_steps). Recount when the datasets change.
s1 = 0
s2 = 2000
ablation_a = 0
# 041-R14: 5% of the epoch, rounded half up (2,000 x 0.05 = 100.00 -> 100).
s2_warmup = 100

[value]
# win head MSE weight (041-R7)
win = 0.5
# 041-R19 (2026-10-21): win_open head MSE weight. Present = a new run builds the head (032-R18,
# win estimate without privileged input for the 031-R12 surrender rule). Clipped apart from the
# other parameters, so they update as without it. Not in bc_core_ablation.toml.
win_open = 0.5

[data]
# Fraction of games trained with z_present = false (041-R8 / 033-R2).
z_drop = 0.25
# Random dihedral symmetry per game at load time (030-R4, 040-R7).
augment = true
# 030-R11 (user decision 2026-10-19): share of games whose enemy race is masked as unknown until
# the first enemy unit is seen (per game, hash of replay sha256 + seed; no extra copies).
enemy_race_mask = 0.05
# 044-R5 ④: round d1 uses seed 15 (after the 041-R29 ④ DAgger rounds' 13 and 14; d2 = 16).
seed = 15
checkpoint_every = 5000
# Also checkpoint at least this often in wall time (061-R10; ~2 updates/min on CUDA).
checkpoint_minutes = 60
# 041-R30 ⑥ / 041-R29 ④ (user decision 2026-11-12, AMB-041-19): a chained teacher step of `botgen` is
# observed through its chain-start step's RawFrame. Only botgen: the relabelled dagger chains are not
# carried out by the model, so their next observation shows no effect (no leak, 041-R22), and the distill
# decision steps have no chains (044-R4).
chain_start_sources = ["botgen"]

# 044-R5 ③ / 041-R26 (AMB-041-15): every game of the teacher sources `botgen` and `dagger` (GameMeta.src of the
# dagger_m2 shards is `dagger`); of the distill games (GameMeta.src `distill`) the share fraction_by_source; of
# the human target-map train games a share per enemy race (both TvT perspectives together). Per game, hash of
# replay sha256 + data.seed, computed by `uranium-train mix-fractions --share` for data.seed 15. `fraction` is
# the single human share aiming at the same total (used only by a game without a T / P / Z enemy).
[data.subsample]
fraction = 0.061
keep_sources = ["botgen", "dagger"]

[data.subsample.fraction_by_race]
T = 0.047
P = 0.0622
Z = 0.06

# 044-R5 ③: the share of the distill games kept (1.0 = all of them when they are below their 20% share).
[data.subsample.fraction_by_source]
distill = 1.0

# 041-R29 ①: the four 032 section 2.7 switches (as config/bc.toml), the 032 section 2.8 switches
# bypass, spatial_preact, aux_priv, aux_jepa (k = 1, 8, 32) and the core fix F1 core_skip
# (AMB-032-14). Absent keys would mean off.
[model]
terrain = true
ctx_token = true
attn_pool = true
outer = 32
bypass = true
spatial_preact = true
core_skip = true
aux_priv = true
aux_jepa = [1, 8, 32]

# 041-R25: dead-channel statistics every 100 updates (execution only).
[monitor]
spatial_every = 100

# 041-R23 ⑥ (AMB-041-13b, user decision 2026-11-10 after the 041-R24 lambda runs: the default
# proposal kept): aux loss weights lambda_priv 0.2, lambda_jepa 0.1.
[aux]
priv = 0.2
jepa = 0.1
