# 050-R9 measurement protocol plan template `ac1_stoch_lf0` (config/protocol/lineage.toml, tools/eval/protocol.py).
# 042-AC1 200 games, baseline (a): Fighting Spirit vs T0 zerg standard, seed_base 42000, stochastic, last_failed 0.
# Snapshot of the Checkpoint 1 plan <shared>/eval/ac1-20261101/plans/01-bc-stoch-lf0.toml: only the name and the model checkpoint are
# placeholders (@NAME@, @CHECKPOINT@); everything else is what Checkpoint 1 was measured with. Do not edit:
# protocol.py refuses a template whose conditions hash differs from lineage.toml.
name = "@NAME@"
seed_base = 42000
save_replay = true
wall_timeout_s = 7200
zero_last_failed = true
[[matchup]]
map = "fighting_spirit"
games = 200
p0 = { kind = "model", checkpoint = "@CHECKPOINT@", sample = "stochastic" }
p1 = { kind = "t0", race = "zerg" }
