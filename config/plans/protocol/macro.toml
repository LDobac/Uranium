# 050-R9 measurement protocol plan template `macro` (config/protocol/lineage.toml, tools/eval/protocol.py).
# 050-R8 macro-opponent check of a model: 4 macro zerg opponents x 10 games, map both, seed_base 46000 (the
# teacher run's seeds), 10 min (max_frames 14,400), stochastic, zero_last_failed false (the plan default; written out
# here), replays kept. Same seeds for BC and RL checkpoints.
# Snapshot of the Checkpoint 1 plan config/plans/model_macro_check.toml: only the name and the model checkpoint are
# placeholders (@NAME@, @CHECKPOINT@); everything else is what Checkpoint 1 was measured with. Do not edit:
# protocol.py refuses a template whose conditions hash differs from lineage.toml.
name = "@NAME@"
seed_base = 46000
save_replay = true
wall_timeout_s = 7200
max_frames = 14400
zero_last_failed = false
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "@CHECKPOINT@", sample = "stochastic" }
p1 = { kind = "oss", name = "ualbertabot2hatchhydra", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "@CHECKPOINT@", sample = "stochastic" }
p1 = { kind = "oss", name = "ualbertabot3hatchmuta", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "@CHECKPOINT@", sample = "stochastic" }
p1 = { kind = "oss", name = "steamhammer2hatchmuta", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "@CHECKPOINT@", sample = "stochastic" }
p1 = { kind = "t0", race = "zerg", build = "zerg_muta" }
