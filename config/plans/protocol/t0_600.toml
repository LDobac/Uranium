# Measurement protocol plan template `t0_600` (config/protocol/lineage.toml, tools/eval/protocol.py).
# T0 600 games (041-AC2): 3 races x 2 maps x 50, argmax then stochastic, seed_base 41000, zero_last_failed true.
# Snapshot of the Checkpoint 1 plan config/plans/bc-vs-t0.toml: only the name and the model checkpoint are
# placeholders (@NAME@, @CHECKPOINT@); everything else is what Checkpoint 1 was measured with. Do not edit:
# protocol.py refuses a template whose conditions hash differs from lineage.toml.
name = "@NAME@"
seed_base = 41000
save_replay = true
# 2 h wall limit as in the ablation T0 plans (the 1,800 s default cuts games that reach the
# 60-minute draw when inference is slow).
wall_timeout_s = 7200
# 030-R10 / E-5: BC checkpoints get last_failed = 0 (BC data never has a failed command).
zero_last_failed = true
[[matchup]]
map = "fighting_spirit"
games = 50
p0 = { kind = "model", checkpoint = "@CHECKPOINT@", sample = "argmax" }
p1 = { kind = "t0", race = "terran" }
