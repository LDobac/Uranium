# 032-R17 (6) (user decision 2026-10-24): the second (PyTorch) core ablation, same games as
# core-ablation-t0.toml (same seeds and matchups). Checkpoints: final step of
# `bc --run core-abl-lstm-pt` / `core-abl-gtrxl-pt` (ckpt-10000, relative to URANIUM_SHARED_DIR).
name = "core-ablation-pt-t0"
seed_base = 32800
save_replay = true
# 032-R17 (2026-10-22): 2 h wall limit, see core-ablation-h2h.toml (the 1,800 s default cuts
# games that reach the 60-minute draw when inference is slow).
wall_timeout_s = 7200
# 030-R10 / E-5: BC checkpoints get last_failed = 0 (BC data never has a failed command).
zero_last_failed = true
