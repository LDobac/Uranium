# 032-R20 (3) (user decision 2026-10-25): T0 games of the five architecture variants, the same
# matchups as core-ablation-pt-t0.toml (T0 terran / protoss / zerg x 2 maps x 50 games =
# 300 per model, stochastic sampling, no z, replays kept). Checkpoints: ckpt-10000 of each
# arch-abl-*-pt run (relative to URANIUM_SHARED_DIR). Run after all seven runs have trained.
name = "arch-abl-pt-t0"
seed_base = 36000
save_replay = true
# 032-R17 (2026-10-22): 2 h wall limit, see core-ablation-h2h.toml (the 1,800 s default cuts
# games that reach the 60-minute draw when inference is slow).
wall_timeout_s = 7200
# 030-R10 / E-5: BC checkpoints get last_failed = 0 (BC data never has a failed command).
zero_last_failed = true
[[matchup]]
map = "fighting_spirit"
games = 50
p0 = { kind = "model", checkpoint = "checkpoints/arch-abl-terrain-pt/ckpt-10000", sample = "stochastic" }
p1 = { kind = "t0", race = "terran" }
[[matchup]]
map = "circuit_breaker"
