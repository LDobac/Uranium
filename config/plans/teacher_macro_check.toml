# 050-R8 / 021-R8 (AMB-021-4): "not always defend" check of the scouting-reactive teacher
# t0-terran-react against the macro (non-rush) zerg opponents of config/rl_rush5.toml (042
# "rush-s2" macro group) without T0 standard zerg (a one-base 12-zergling all-in, its own plan
# config/plans/teacher_t0zerg_check.toml; rule advisory reports/m6_teacher_rush_rule_advice.md
# §1), 10 games each, map "both" (Fighting Spirit / Circuit Breaker 5 + 5), 60 min, replays kept;
# scripted players and OSS bots only (uranium-env run).
# Pass (050-R8, per opponent, summary.md "T0 Terran sessions"):
# - ualbertabot2hatchhydra, ualbertabot3hatchmuta: bunker before 4:00 0/10, ①②④′④″ held 0/10,
#   expand by 4:00 >= 9/10, scv_8m >= 16 >= 9/10.
# - steamhammer2hatchmuta, T0 zerg_muta: pre-emptive bunker 0/10, ①②④′④″ held 0/10 (③ allowed),
#   scv_8m >= 16 >= 8/10, expanded >= 8/10.
# 10 min (max_frames 14,400; the teacher data is cut at 8:00, 7th advisory F).
name = "teacher-macro-check"
seed_base = 46000
save_replay = true
wall_timeout_s = 7200
max_frames = 14400
[[matchup]]
map = "both"
games = 10
p0 = { kind = "t0", race = "terran", build = "terran_react" }
p1 = { kind = "oss", name = "ualbertabot2hatchhydra", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "t0", race = "terran", build = "terran_react" }
p1 = { kind = "oss", name = "ualbertabot3hatchmuta", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "t0", race = "terran", build = "terran_react" }
p1 = { kind = "oss", name = "steamhammer2hatchmuta", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "t0", race = "terran", build = "terran_react" }
p1 = { kind = "t0", race = "zerg", build = "zerg_muta" }
