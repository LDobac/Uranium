# 032-R17 / 032-AC7 (AMB-032-6, 2026-10-18): each short S1 core run vs T0 at the 041-AC2 scale
# (50 games per race x map), stochastic sampling only (temp 1), no z. Wilson 95% in summary.md
# (050-R2). Checkpoints: final step of `bc --run core-abl-lstm` / `core-abl-gtrxl` (ckpt-5300,
# relative to URANIUM_SHARED_DIR, 061).
name = "core-ablation-t0"
seed_base = 32800
save_replay = true
# 032-R17 (2026-10-22): 2 h wall limit, see core-ablation-h2h.toml (the 1,800 s default cuts
# games that reach the 60-minute draw when inference is slow).
wall_timeout_s = 7200
# 030-R10 / E-5: BC checkpoints get last_failed = 0 (BC data never has a failed command).
zero_last_failed = true
[[matchup]]
map = "fighting_spirit"
games = 50
p0 = { kind = "model", checkpoint = "checkpoints/core-abl-lstm/ckpt-5300", sample = "stochastic" }
p1 = { kind = "t0", race = "terran" }
[[matchup]]
map = "circuit_breaker"
