# Checkpoint 1 T1 evaluation (user decision 2026-11-07: 50 games per T1 bot; 12th advisory
# reports/m6_rl_stall_advice12.md section 3): Checkpoint 1 model bc-dagger-r1/ckpt-1137, stochastic,
# vs UAlbertaBot / Steamhammer / McRave (Z 18, P 16, T 16), ZZZKBot Z 50, Stardust P 50, Iron T 50 = 300 games: every
# implemented T1 bot (021, config variants are not separate bots). McRave added 2026-11-08 (user question: all T1 bots;
# 50 evaluation games cost about an hour, unlike its RL throughput cost). map = both splits each matchup over the two maps.
# Same seeds as config/plans/t1_eval_bc.toml (BC baseline); only the checkpoint and name differ.
name = "t1-eval-ck1"
seed_base = 46000
save_replay = true
wall_timeout_s = 7200
zero_last_failed = true
[[matchup]]
map = "both"
games = 18
p0 = { kind = "model", checkpoint = "checkpoints/bc-dagger-r1/ckpt-1137", sample = "stochastic" }
p1 = { kind = "oss", name = "ualbertabot", race = "zerg" }
