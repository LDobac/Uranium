# 050-R8 macro-opponent check of a model (9th advisory reports/m6_rl_stall_advice9.md section 2
# item 2): config/plans/teacher_macro_check.toml with only p0 replaced by a model, the same
# 4 macro zerg opponents x 10 games, map "both", seed_base 46000 (same seeds and start slots as
# the teacher run), 10 min (max_frames 14,400), replays kept. Run it as an eval job
# (`python -m uranium eval-worker`, docs/commands.md); the checkpoint is replaceable per job
# (edit `checkpoint` in the job's plan copy). Read per opponent from the model rows:
# bunker before 4:00 (bunker_s < 240), scv_8m >= 16, CC order by 5:00 (command streams), wins.
# 9th advisory: if a pure teacher clone builds pre-emptive bunkers in > 5/40, rush
# identification was not learned.
name = "model-macro-check"
seed_base = 46000
save_replay = true
wall_timeout_s = 7200
max_frames = 14400
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "checkpoints/bc-tclone-e5/ckpt-418", sample = "stochastic" }
p1 = { kind = "oss", name = "ualbertabot2hatchhydra", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "checkpoints/bc-tclone-e5/ckpt-418", sample = "stochastic" }
p1 = { kind = "oss", name = "ualbertabot3hatchmuta", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "checkpoints/bc-tclone-e5/ckpt-418", sample = "stochastic" }
p1 = { kind = "oss", name = "steamhammer2hatchmuta", race = "zerg" }
[[matchup]]
map = "both"
games = 10
p0 = { kind = "model", checkpoint = "checkpoints/bc-tclone-e5/ckpt-418", sample = "stochastic" }
p1 = { kind = "t0", race = "zerg", build = "zerg_muta" }
