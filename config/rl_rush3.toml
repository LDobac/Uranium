# 042 "신호 밀도·KL run" `rush-s3` (AMB-042-17, user decisions 2026-11-04,
# reports/m6_rl_stall_advice2.md): `config/rl_rush2.toml` with only these changes —
# [curriculum] c1_ladder = 0.90, c1_anchor = 0.05, c1_snapshot = 0.05, c1_self = 0 (no current-Main
# self-play); ladder_pick = { rush = "band", macro = "f_var" } with [curriculum.band] center 0.5,
# width 0.15, exclude_below 0.10; [league] model_game_max_s = 1500 (25 min, 042-R15); [kl] the
# rl.toml schedule 0.1 / 0.01 / 20,000 (first decided 0.03 / 0.01 / 1,500, reverted 2026-11-04
# after the F2 diagnostics), [kl.head_scale] all 1.0;
# [loss] td_lambda = 0.95; [sil] enabled = false (042-R16, off until the user decides after the
# 1.5M-step check); three 50-60% rung UAlbertaBot variants added to the rush group (user decision
# 2026-11-04 after the measurement, 10 rush + 5 macro). Groups, the other ladder entries, anchor,
# snapshots, rewards, concede as in rush-s2. Start: `--init rush-s2/ckpt-2151242 --bc
# bc-s2e2-pt/ckpt-11387`, V-trace, new run id `rush-s3`. The train.csv diagnostics columns (042-R2) need no setting.
#
# The rush-s2 header follows. 042 "러시·운영 혼합 run" `rush-s2` (AMB-042-16, 2026-11-03): `config/rl_rush1.toml` with only
# these changes — [league] win_rate_decay = 0.97; [curriculum] ladder_groups = { rush = 0.5,
# macro = 0.5 }; the 7 rush-s1 [[ladder]] entries with group = "rush" and a "macro" group of
# operational (non-rush) zerg opponents; [reward] pseudo = "scout" (033-R11: r_scout 033-R9 /
# r_survive 033-R10 at the user-confirmed values, no z, no --z-table). Everything else as in
# rush-s1 (shares, anchor AC1 ckpt-3133569, snapshots, r_value, concede). Start: `--init
# rush-s1/ckpt-<LATEST at its stop> --bc bc-s2e2-pt/ckpt-11387`, V-trace, new run id.
#
# The rush-s1 header follows. 042 "러시 커리큘럼 run" `rush-s1` (AMB-042-15, 2026-11-03): `config/rl_t1self2.toml` with only
# these changes — [curriculum] c1_ladder = 0.70 (the [[ladder]] below, ladder_pick = "f_var"),
# c1_anchor = 0.10, c1_snapshot = 0.15, c1_self = 0.05 (current Main), c1_t1 = 0, c1_t0 = 0;
# [concede] enabled = true with the default bar (screen supply <= 4 for 120 s from 3:00, 042-R14).
# [[t1]] stays as in t1self-s2 (unused at c1_t1 = 0). Start: `--init
# ac1-vtrace-s1/ckpt-3133569 --bc bc-s2e2-pt/ckpt-11387`, V-trace, new run id.
#
# The t1self-s2 header follows. 042 "T1·셀프 run" 2차 `t1self-s2` (AMB-042-14, 2026-11-03): the 1차 settings
# (`config/rl_t1self.toml`: rl.toml with start_stage = "C1", auto_advance = false, c1_t0 = 0,
# r_value_stages = ["C0", "C1"], McRave left out of [[t1]]) with only these changes —
# [curriculum] c1_t1 = 0.5, c1_self = 0.15 (current Main), c1_snapshot = 0.25, c1_anchor = 0.10,
# r_value_vs_model = false; [league] anchor = AC1 V-trace s1 ckpt-3133569; [snapshot]
# main_every_updates = 250, main_candidates = 4; Steamhammer Terran / Zerg only (021-R4: T1 per
# race T = UAlbertaBot, Steamhammer, Iron; P = UAlbertaBot, Stardust; Z = UAlbertaBot,
# Steamhammer, ZZZKBot). Keep every other value equal to rl.toml.
#
# 042 RL / league initial values (AMB-042-3, 2026-10-17). Tuning targets (042-R9):
# read by `python -m uranium rl` and copied into every checkpoint (061-R10).
# agent step = one act() call; update = one learner parameter update.

# Batch: lanes x seq_len agent steps per update (042-R8: T = 64).
lanes = 32
seq_len = 64
micro_lanes = 1
# 061-R6 (G-D6): checkpoints kept on the share, 0 = all (user decision 2026-10-31: keep every
# RL checkpoint so learning curves can be evaluated afterwards).
keep_checkpoints = 0

[optimizer]
# Adam (AlphaStar RL stage), 1/10 of the BC learning rate.
lr = 3e-5
beta1 = 0.0
beta2 = 0.99
eps = 1e-5
weight_decay = 0.0
# Global L2-norm clip over all parameter gradients after the lane-group sum (041-R3, G-D4).
grad_clip = 1.0

[loss]
gamma = 1.0
# rush-s3 (user decision 2026-11-04, AMB-042-17, advice A4): 0.95 (rl.toml 0.8).
td_lambda = 0.95
vtrace_rho_bar = 1.0
vtrace_c_bar = 1.0
pg = 1.0
upgo = 1.0
value = 0.5
# 042-R13: win_open head (when the model has one) regresses the win v-trace target, same form.
win_open = 0.5

[entropy]
# Per-head coefficients, summed over used heads only (032-R10).
action = 3e-3
delay = 1e-3
queued = 1e-3
selected = 1e-3
target_unit = 1e-3
target_loc = 1e-3

[kl]
# coef = max(floor, init * 0.5^(update / half_life_updates)), update counted from this run's
# update 0 (042-R9). rush-s3 (user decision 2026-11-04, AMB-042-17): the rl.toml schedule
# 0.1 / 0.01 / 20,000. The advice A1 values 0.03 / 0.01 / 1,500 were reverted after the F2
# diagnostics (runs/diag_20261104/notes.md): the KL penalty is about 0.001 per decision and RL
# barely moved the rare build actions (x1.0-1.25 of BC), so "KL holds rare actions" is rejected.
init = 0.1
floor = 0.01
half_life_updates = 20000

[kl.head_scale]
# 042-R9 (AMB-042-17, advice A2): all 1.0 for rush-s3 (user decision 2026-11-04).
action = 1.0
delay = 1.0
queued = 1.0
selected = 1.0
target_unit = 1.0
target_loc = 1.0

[actors]
# Push weights to the inference server every K updates.
weight_push_every = 4
# 042-R4: drop trajectories whose behaviour version lags by more than this.
max_policy_lag = 32
# Trajectory queue capacity per agent in batches of `lanes` segments (at least 1).
queue_batches = 4
# Full queue (user decision 2026-10-31): "wait" = backpressure, the pushing game waits for a
# place (FIFO across games; a game in lockstep simply pauses); "drop_oldest" = previous
# behaviour, never wait and drop the oldest segment.
queue_full = "wait"
# Longest single wait for a place (AMB-042-11); then the oldest segment is dropped
# (`dropped_full`). Keep well below the OpenBW drop time (011-R18, 600 s).
queue_wait_max_s = 120
# Wall-clock limit of one RL game (AMB-042-12, 020-R3), queue waits included; the game ends as
# Timeout and is left out of training like an Aborted one (042-R3).
game_wall_timeout_s = 7200

[league]
# 042-R7 time share, applied from C2. C0/C1 train Main only.
share_main = 0.5
share_main_exploiter = 0.25
share_league_exploiter = 0.25
# Main opponents in C2.
main_pfsp = 0.5
main_self = 0.35
main_t1 = 0.15
# PFSP f_hard(x) = (1 - x)^p
pfsp_power = 2.0
# Main Exploiter falls back to f_var over Main snapshots below this win rate.
main_exploiter_fallback_win_rate = 0.2
main_exploiter_fallback_share = 0.5
# Win-rate table: per-game EMA decay d, prior for unseen opponents. Every win-table pick uses d
# (ladder f_var, C1 snapshot f_hard, C2 PFSP, Main Exploiter f_var). rush-s2 (user decision
# 2026-11-03): 0.97, about 33 games of memory per opponent (0.99: about 100).
win_rate_decay = 0.97
win_rate_prior = 0.5
# p_race = uniform_mix / 3 + (1 - uniform_mix) * (1 - w_r) / sum(1 - w)
race_uniform_mix = 0.5
# 021-R7: Random race share for multi-race T0/T1 bots (T1: only bots listing all three races,
# AMB-042-14; here UAlbertaBot).
bot_random_race = 0.2
# 042 anchor (AMB-042-14): a fixed opponent, an RL checkpoint folder `ckpt-<step>` (its
# agents/main) or that agents/main folder, relative to URANIUM_SHARED_DIR. t1self-s2: the start
# checkpoint AC1 V-trace s1 (user decision).
anchor = "checkpoints/ac1-vtrace-s1/ckpt-3133569"
# 042-R15 (user decision 2026-11-04, AMB-042-17, advice B2): RL games against a model (anchor,
# snapshots) end as a draw (TimeLimitDraw, r_win 0) at 25 game minutes = 36,000 frames; bot and
# evaluation games keep 60 minutes.
model_game_max_s = 1500

[snapshot]
# t1self-s2: a Main snapshot every 250 updates (user decision, AMB-042-14).
main_every_updates = 250
exploiter_win_rate = 0.7
exploiter_win_window = 200
exploiter_max_updates = 4000
league_exploiter_reset_prob = 0.25
# 042 C1 snapshot candidates (AMB-042-14): the latest this many published Main snapshots,
# 0 = all. Older snapshots stay on the share.
main_candidates = 4

[curriculum]
# 042-R5. Window = most recent games per opponent race.
window_games = 300
c0_t0 = 0.8
c0_self = 0.2
c0_to_c1_win_rate_vs_t0 = 0.7
# rush-s3 (user decision 2026-11-04, AMB-042-17, advice B1): bots are the ladder only (no T0 /
# T1 shares) at 0.90; models are the anchor 0.05 and past Main snapshots 0.05 (PFSP f_hard over
# the [snapshot] main_candidates latest published; before any snapshot this share goes to the
# anchor); no current-Main self-play.
c1_t0 = 0.0
c1_t1 = 0.0
c1_ladder = 0.90
c1_self = 0.0
c1_snapshot = 0.05
c1_anchor = 0.05
# rush-s3 (user decision 2026-11-04, AMB-042-17, advice B3): the rush group picks by "band"
# ([curriculum.band] below), the macro group by f_var x(1 - x) (042 사다리 안 상대 선택).
ladder_pick = { rush = "band", macro = "f_var" }
# 042 사다리 그룹 (AMB-042-16, kept for rush-s3, user decision 2026-11-04): a ladder game first
# draws the group by these shares (rush 45%, macro 45% of all games), then an entry of that group
# by ladder_pick.
ladder_groups = { rush = 0.5, macro = 0.5 }
c1_to_c2_win_rate_vs_t1 = 0.5
# Pseudo-reward (033 r_build, r_units) linear decay to 0 after entering C2.
pseudo_reward_decay_updates = 20000
# 042-R5 (AMB-042-13). Stage of a new league (no LATEST): "C0" or "C1"; a resumed run keeps
# the stage of its checkpoint.
start_stage = "C1"
# false = never change stage on the win-rate bars above (windows are still recorded).
# T1·셀프 run: stage changes are the user's decision.
auto_advance = false
# 033: stages that use r_value; weight 0 in the others. T1·셀프 run: on in C1 as in AC1.
r_value_stages = ["C0", "C1"]
# 033 (AMB-042-14): r_value policy weight 0 in games against a model (current Main, snapshots,
# anchor), so only T1 games use it; the value head learns r_value in every game (user decision).
r_value_vs_model = false
# On resume the ratios above, auto_advance, r_value_stages, r_value_vs_model, ladder_pick,
# ladder_groups, [league] anchor and win_rate_decay, [snapshot] main_candidates, [[t1]],
# [[ladder]], [reward] and [concede] follow this file; stage, win tables, windows and snapshots
# come from the checkpoint (042). A [reward] pseudo other than the checkpoint's is a start error.
# So do [kl] (the update count continues from the checkpoint), [kl.head_scale], [loss]
# td_lambda, [curriculum.band], [league] model_game_max_s and [sil] (AMB-042-17).

[curriculum.band]
# 042 사다리 선택 band (user decision 2026-11-04, AMB-042-17): exp(-((x - 0.5) / 0.15)^2) over
# Main's win-table value x (unseen 0.5); entries below 0.10 are left out while some entry of the
# group is at or above 0.10.
center = 0.5
width = 0.15
exclude_below = 0.10

[ppo]
# Comparison baseline (042 algorithm alternatives).
clip = 0.2
gae_lambda = 0.95
epochs = 2
# Adopt PPO only if 3-seed mean final win rate beats V-trace by more than this.
adopt_margin = 0.03

[replays]
# 042-R11: keep 1 replay per this many games (game id multiple) plus every winner-disagreement
# game (020-R13), under <URANIUM_SHARED_DIR>/runs/<run>/replays/. Never deleted.
sample_every = 100

[sil]
# 042-R16 자기 모방·막은 판 재학습 (user decision 2026-11-04, AMB-042-17): off. Whether to turn it
# on and its numbers are decided by the user after the 1.5M-step check; the other keys stay at
# their defaults (기본안(미확정), config/rl.toml comment) until then.
enabled = false

[reward]
# 033-R11 (AMB-042-16, user decision 2026-11-03): the build / units value heads and channels learn
# r_scout / r_survive; no z (a --z-table is a start error). r_win / r_value weights:
# config/reward.toml, r_value stages as above.
pseudo = "scout"

[reward.scout]
# 033-R9 r_scout (user-confirmed values 2026-11-03): one-time items from our own vision only
# (033-R5); policy weight, per-game cap of the decayed raw values, x0.5 in games against a model.
weight = 0.15
cap = 1.0
vs_model = 0.5
# Full up to 4:00, linear to 0 at 8:00 (game seconds, 24 fps).
full_until_s = 240.0
zero_at_s = 480.0
main_radius_tiles = 10.0
workers_min = 4
# Raw values: enemy main, each enemy building type, a second enemy resource depot, 4+ workers
# in one observation, first army unit.
main = 0.3
building_type = 0.1
expansion = 0.1
workers = 0.1
army = 0.1

[reward.survive]
# 033-R10 r_survive (user-confirmed values 2026-11-03): 3:00-8:00, min(own SCVs / 20, 1) per
# game second / 300; bot games only (vs_model 0).
weight = 0.1
vs_model = 0.0
from_s = 180.0
until_s = 480.0
scv_target = 20

[concede]
# 042-R14 collapse concede (AMB-042-15): on for rush-s1 with the default bar. A model session
# (learning agent or model opponent) whose own screen supply stays <= max_supply (units in
# production included) at every decision for hold_s seconds, counted from after_s, leaves with
# "gg": a normal loss of that side (020-R18, 033), games.csv end_reason = Concede. Plan /
# evaluation games (the run checks included) never concede.
enabled = true
max_supply = 4
hold_s = 120
after_s = 180

# T1 bots (021) and the races they play (measured in M3, config/plans/m3-t1.toml). The league
# picks from this list as is (it does not check which bots the game hosts have), so every bot
# listed must be installed on every game host; Random applies to bots listing all three races
# (021-R7, AMB-042-14).
# T1·셀프 run: McRave left out (10-40x slower than the other T1 bots in lockstep, AMB-042-13).
# 2차: Steamhammer Terran / Zerg only (the Windows build's Protoss crashes at 8-10 min, user
# decision, AMB-042-14), so no Random for it.
[[t1]]
name = "ualbertabot"
races = ["Terran", "Protoss", "Zerg"]
[[t1]]
name = "steamhammer"
races = ["Terran", "Zerg"]
[[t1]]
name = "stardust"
races = ["Protoss"]
[[t1]]
name = "zzzkbot"
races = ["Zerg"]
[[t1]]
name = "iron"
races = ["Terran"]

# rush-s3 (AMB-042-17): the rush-s2 lists plus the 50-60% rush rung (advice B5, 021 "T1 설정
# 변형"), user decision 2026-11-04 after the measurement (start ckpt rush-s2/ckpt-2151242,
# stochastic, Fighting Spirit 15 + Circuit Breaker 15, W-L-D, <shared>/eval/rushrung-20261104/):
# ualbertabot9pool10lings 19-7-4 (63%), ualbertabot9pool12lings 17-7-6 (57%),
# ualbertabot9poolhydra 13-15-2 (43%) added (the last three rush entries below);
