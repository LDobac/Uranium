[package]
name = "uranium-data"
description = "BC data side (spec 041): shard format, read and write (040), train/val/test split rule, game order, data RNG, dataset fingerprints, lanes, batches, prefetch, packed storage, config fingerprints (collate comes from uranium-env)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testkit = ["uranium-env/testkit"]

[dependencies]
uranium-env.workspace = true
uranium-store.workspace = true
uranium-proto.workspace = true
anyhow.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
zstd.workspace = true

[dev-dependencies]
uranium-data = { workspace = true, features = ["testkit"] }
