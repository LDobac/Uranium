[package]
name = "uranium-replay"
description = "StarCraft replay parser, SC:R -> 1.16.1 converter, BC dataset build (spec 040, shard format lives in uranium-data) and replay command tables (013)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
explode = "0.1.2"
flate2 = "1"
uranium-proto.workspace = true
uranium-env.workspace = true
uranium-match.workspace = true
uranium-data.workspace = true
uranium-scripted.workspace = true
uranium-store.workspace = true
toml.workspace = true
postcard.workspace = true
sha2.workspace = true
encoding_rs = "=0.8.35"

[dev-dependencies]
uranium-scripted = { workspace = true, features = ["testkit"] }
uranium-data = { workspace = true, features = ["testkit"] }
