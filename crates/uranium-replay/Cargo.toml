[package]
name = "uranium-replay"
description = "StarCraft replay parser, SC:R -> 1.16.1 converter and BC dataset tools (spec 040, 013)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
explode = "0.1.2"
flate2 = "1"
uranium-proto.workspace = true
dotenvy.workspace = true
uranium-env = { path = "../uranium-env" }
toml.workspace = true
postcard.workspace = true
zstd = "0.13"
sha2.workspace = true
# 040-R15 / A-1: 1.16.1 map titles are CP949.
encoding_rs = "=0.8.35"

[target.'cfg(unix)'.dependencies]
# 040-R17: O_DIRECT / posix_fadvise for the cache-bypassing read-back of shared-drive copies.
libc = "0.2"
