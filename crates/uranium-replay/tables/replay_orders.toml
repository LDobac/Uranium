# Replay order -> 034 action mapping for label inversion (040-R3, R11, 031-AC3). Data only (013-R1).
# `order` is the BW / BWAPI Order id carried by TargetedOrder (0x15) and Build (0x0C) commands.
# `unit` is used when the command names a target unit, `pos` otherwise ("" = not applicable).

[[order]]
names = ["Move", "Follow"]
ids = [6, 49]
unit = "Move_Unit"
pos = "Move_Pos"

[[order]]
names = ["Attack1", "Attack2", "AttackUnit", "AttackTile", "AttackMove"]
ids = [8, 9, 10, 12, 14]
unit = "Attack_Unit"
pos = "Attack_Pos"

