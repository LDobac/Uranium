[package]
name = "uranium-model"
description = "Policy / value network in Burn (spec 032): encoders, Core (LSTM / GTrXL), autoregressive heads"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enable only on a CUDA GPU PC (CLAUDE.md fixed conditions): --features cuda
cuda = ["burn/cuda"]

[dependencies]
burn = { workspace = true, features = ["std", "autodiff", "flex", "vulkan", "store"] }
uranium-env = { path = "../uranium-env" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
