[package]
name = "uranium-train"
description = "Training: behaviour cloning from replay shards (spec 041), RL and the league (spec 042)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enable only on a CUDA host: --features cuda
cuda = ["burn/cuda", "uranium-model/cuda", "uranium-agent/cuda", "uranium-runner/cuda"]

[dependencies]
burn = { workspace = true, features = ["std", "autodiff", "flex", "vulkan", "optim", "store"] }
uranium-model = { path = "../uranium-model" }
uranium-env = { path = "../uranium-env" }
uranium-replay = { path = "../uranium-replay" }
uranium-data = { path = "../uranium-data" }
uranium-store = { path = "../uranium-store" }
uranium-agent.workspace = true
uranium-runner = { path = "../uranium-runner" }
uranium-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
zstd = "0.13"
ctrlc = "3.5"

[target.'cfg(unix)'.dependencies]
# 060-R6 (H-4): child training in its own process group, PR_SET_PDEATHSIG, SIGINT forwarding.
# 061-R8: statvfs for the disk usage warning.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 061-R8: GetDiskFreeSpaceExW for the disk usage warning (same windows-sys as uranium-hostd).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
