[package]
name = "uranium-train"
description = "Training: behaviour cloning from replay shards (spec 041); RL / league later (042)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enable only on a CUDA GPU PC: --features cuda
cuda = ["burn/cuda", "uranium-model/cuda"]

[dependencies]
burn = { workspace = true, features = ["std", "autodiff", "flex", "vulkan", "optim", "store"] }
uranium-model = { path = "../uranium-model" }
uranium-env = { path = "../uranium-env" }
uranium-replay = { path = "../uranium-replay" }
uranium-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
