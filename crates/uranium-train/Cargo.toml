[package]
name = "uranium-train"
description = "Training host commands (041 data checks, 061 manifests and devices, 033-R8 z table), the 060-R6 watchdog and the 061-R13 run queue worker around the PyTorch trainer"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uranium-env = { path = "../uranium-env" }
uranium-replay = { path = "../uranium-replay" }
uranium-data = { path = "../uranium-data" }
uranium-store = { path = "../uranium-store" }
uranium-league = { path = "../uranium-league" }
uranium-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
zstd = "0.13"
ctrlc = "3.5"

[target.'cfg(unix)'.dependencies]
# 060-R6 (H-4): child training in its own process group, PR_SET_PDEATHSIG, SIGINT forwarding.
# 061-R8: statvfs for the disk usage warning.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 061-R8: GetDiskFreeSpaceExW for the disk usage warning (same windows-sys as uranium-hostd).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
