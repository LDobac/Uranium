edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testkit = ["uranium-env/testkit"]

[dependencies]
uranium-proto.workspace = true
uranium-scripted.workspace = true
uranium-env.workspace = true
uranium-store.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
uranium-env = { workspace = true, features = ["testkit"] }
