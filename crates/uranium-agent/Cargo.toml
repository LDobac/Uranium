[package]
name = "uranium-agent"
description = "Agent server: accepts bridge sessions, routes each (game_id, slot) to a policy and batches model inference (spec 001-R6, 020-R11, 032-R14)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Synthetic frames for tests of other crates (uranium-py: the Python inference tests).
testkit = []

[dependencies]
uranium-proto.workspace = true
uranium-scripted.workspace = true
uranium-env = { path = "../uranium-env" }
# Host collate and action columns (AMB-000-4: the model runs in Python behind `broker`).
uranium-data = { path = "../uranium-data" }
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
