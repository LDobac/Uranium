[package]
name = "uranium-store"
description = "Shared storage (spec 061): run locks and heartbeat, checkpoint push/pull, manifests, device records, disk warnings, training state files"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uranium-replay = { path = "../uranium-replay" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ctrlc = "3.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }
