[package]
name = "uranium-store"
description = "Shared storage (spec 061): run locks and heartbeat, checkpoint push/pull, manifests, device records, disk warnings, training state files"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ctrlc.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }
