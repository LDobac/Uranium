[package]
name = "uranium-py"
description = "Python extension module uranium._core (PyO3): the Rust data side, storage and game runtime for the PyTorch trainer and inference (001, AMB-000-4)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
uranium-data = { workspace = true, features = ["testkit"] }
uranium-agent = { workspace = true, features = ["testkit"] }
uranium-runner.workspace = true
uranium-league = { workspace = true, features = ["testkit"] }
uranium-env.workspace = true
uranium-proto.workspace = true
uranium-store.workspace = true
anyhow.workspace = true
serde_json.workspace = true
pyo3 = "0.30"
numpy = "0.30"

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1"
