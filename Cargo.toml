[workspace]
resolver = "3"
members = [
    "crates/uranium-proto",
    "crates/uranium-bridge-openbw",
    "crates/uranium-scripted",
    "crates/uranium-agent",
    "crates/uranium-hostd",
    "crates/uranium-env",
    "crates/uranium-runner",
    "crates/uranium-replay",
    "crates/uranium-data",
    "crates/uranium-store",
    "crates/uranium-league",
    "crates/uranium-py",
    "crates/uranium-train",
    "crates/uranium-ladder",
    "tools/casc-extract",
    "tools/bwapi-tables",
]
exclude = ["bridge/scr"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
proptest = "1"
sha2 = "0.11"
toml = "1"
socket2 = "0.6"
ureq = "3"
zstd = "0.13"
libc = "0.2"
windows-sys = "0.61"
ctrlc = "3.5"
uranium-proto = { path = "crates/uranium-proto" }
uranium-env = { path = "crates/uranium-env" }
uranium-scripted = { path = "crates/uranium-scripted" }
uranium-replay = { path = "crates/uranium-replay" }
uranium-store = { path = "crates/uranium-store" }
uranium-data = { path = "crates/uranium-data" }
uranium-agent = { path = "crates/uranium-agent" }
uranium-runner = { path = "crates/uranium-runner" }
uranium-league = { path = "crates/uranium-league" }

[profile.release]
debug = 1
