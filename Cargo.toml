[workspace]
resolver = "3"
members = [
    "crates/uranium-proto",
    "crates/uranium-bridge-openbw",
    "crates/uranium-scripted",
    "crates/uranium-agent",
    "crates/uranium-hostd",
    "crates/uranium-env",
    "crates/uranium-replay",
    "crates/uranium-model",
    "tools/bench",
    "tools/casc-extract",
    "tools/bwapi-tables",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 060: Burn is pinned via Cargo.lock; upgrades go through a spec change.
burn = { version = "=0.22.0", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
proptest = "1"
sha2 = "0.11"
uranium-proto = { path = "crates/uranium-proto" }
uranium-scripted = { path = "crates/uranium-scripted" }
uranium-agent = { path = "crates/uranium-agent" }
toml = "1"
socket2 = "0.6"

[profile.release]
debug = 1
