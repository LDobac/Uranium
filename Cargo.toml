[workspace]
resolver = "3"
members = [
    "crates/uranium-proto",
    "crates/uranium-bridge-openbw",
    "crates/uranium-scripted",
    "crates/uranium-agent",
    "crates/uranium-hostd",
    "crates/uranium-env",
    "crates/uranium-runner",
    "crates/uranium-replay",
    "crates/uranium-data",
    "crates/uranium-store",
    "crates/uranium-league",
    "crates/uranium-py",
    "crates/uranium-train",
    "crates/uranium-ladder",
    "tools/casc-extract",
    "tools/bwapi-tables",
]
# 012: the SC:R bridge is a Windows x64 cdylib with its own workspace (bridge/scr/Cargo.toml),
# so Linux hosts never build it (001-R8).
exclude = ["bridge/scr"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# The model, training and inference are PyTorch (python/uranium, AMB-000-4); the last Burn
# commit is tagged `burn-final`.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
proptest = "1"
sha2 = "0.11"
uranium-proto = { path = "crates/uranium-proto" }
uranium-scripted = { path = "crates/uranium-scripted" }
uranium-agent = { path = "crates/uranium-agent" }
toml = "1"
socket2 = "0.6"
ureq = "3"

[profile.release]
debug = 1
