[workspace]
resolver = "3"
members = [
    "crates/uranium-proto",
    "crates/uranium-bridge-openbw",
    "crates/uranium-scripted",
    "crates/uranium-agent",
    "crates/uranium-hostd",
    "crates/uranium-env",
    "crates/uranium-runner",
    "crates/uranium-replay",
    "crates/uranium-data",
    "crates/uranium-store",
    "crates/uranium-model",
    "crates/uranium-train",
    "crates/uranium-ladder",
    "tools/bench",
    "tools/casc-extract",
    "tools/bwapi-tables",
]
# 012: the SC:R bridge is a Windows x64 cdylib with its own workspace (bridge/scr/Cargo.toml),
# so Linux hosts never build it (001-R8).
exclude = ["bridge/scr"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 060: Burn is pinned via Cargo.lock; upgrades go through a spec change.
# 041-R15 (G-D5, 2026-10-19 user decision): Burn kernel autotune + fusion on for every build, so the
# core comparison, BC, RL and inference all use the same setting (CUDA and Vulkan; Flex has
# neither). The autotune cache goes to URANIUM_AUTOTUNE_CACHE_DIR (uranium_model::runtime).
burn = { version = "=0.22.0", default-features = false, features = ["autotune", "fusion"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
proptest = "1"
sha2 = "0.11"
uranium-proto = { path = "crates/uranium-proto" }
uranium-scripted = { path = "crates/uranium-scripted" }
uranium-agent = { path = "crates/uranium-agent" }
toml = "1"
socket2 = "0.6"
ureq = "3"

[profile.release]
debug = 1
